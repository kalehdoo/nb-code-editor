[package]
name = "editor-demo-server"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
editor-core = { path = "../../editor-core" }
tempfile = "3"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
